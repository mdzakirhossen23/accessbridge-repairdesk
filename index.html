<script>
'use strict';
const byId=id=>document.getElementById(id);
const win=byId('win'), main=byId('main'), header=win.querySelector('header');
const languages={en:'English',bn:'বাংলা',ar:'العربية',nl:'Nederlands',de:'Deutsch'};
const keys='normal max close open online offline local'.split(' ');
const dictionary={
 en:'Normal|Maximize|Close|Open AccessBridge RepairDesk|Online|Offline|Local storage',
 bn:'স্বাভাবিক|বড় করুন|বন্ধ|AccessBridge RepairDesk খুলুন|অনলাইন|অফলাইন|স্থানীয় স্টোরেজ',
 ar:'عادي|تكبير|إغلاق|فتح AccessBridge RepairDesk|متصل|غير متصل|تخزين محلي',
 nl:'Normaal|Maximaliseren|Sluiten|AccessBridge RepairDesk openen|Online|Offline|Lokale opslag',
 de:'Normal|Maximieren|Schließen|AccessBridge RepairDesk öffnen|Online|Offline|Lokaler Speicher'
};
let language='en', page='dashboard', maximized=false, bounds;
const tr=key=>dictionary[language].split('|')[keys.indexOf(key)];
const num=value=>new Intl.NumberFormat(language).format(value);
const element=(tag,content,className)=>{const node=document.createElement(tag);if(content!==undefined)node.textContent=content;if(className)node.className=className;return node};
const button=(label,action,className)=>{const node=element('button',label,className);node.type='button';node.onclick=action;return node};
function fit(rect){
  const width=Math.min(innerWidth,Math.max(Math.min(360,innerWidth),rect.width));
  const height=Math.min(innerHeight,Math.max(Math.min(320,innerHeight),rect.height));
  return {width,height,left:Math.max(0,Math.min(rect.left,innerWidth-width)),top:Math.max(0,Math.min(rect.top,innerHeight-height))};
}
function paint(){
  const rect= maximized ? {left:0,top:0,width:innerWidth,height:innerHeight} : fit(bounds);
  for(const key of Object.keys(rect))win.style[key]=rect[key]+'px';
  win.style.borderRadius=maximized?'0':'';
  win.querySelectorAll('.handle').forEach(node=>node.hidden=maximized);
}
function normal(){
  maximized=false;
  const width=Math.min(1200,innerWidth),height=Math.min(700,innerHeight);
  bounds={width,height,left:(innerWidth-width)/2,top:(innerHeight-height)/2};
  paint();
}
new ResizeObserver(()=>{if(!win.hidden)byId('size').textContent=win.offsetWidth+' × '+win.offsetHeight}).observe(win);
window.addEventListener('resize',paint);
function pointerDrag(node,edge){
  node.addEventListener('pointerdown',event=>{
    if(maximized||event.button!==0||event.target.closest('button,a'))return;
    if(!edge&&matchMedia('(pointer:coarse)').matches)return;
    event.preventDefault();
    node.setPointerCapture(event.pointerId);
    const start=fit(bounds),x=event.clientX,y=event.clientY;
    const move=e=>{
      if(e.pointerId!==event.pointerId)return;
      const dx=e.clientX-x,dy=e.clientY-y;
      const next={...start};
      if(!edge){next.left+=dx;next.top+=dy}
      if(edge.includes('e'))next.width=Math.min(start.width+dx,innerWidth-start.left);
      if(edge.includes('s'))next.height=Math.min(start.height+dy,innerHeight-start.top);
      if(edge.includes('w')){
        next.left=Math.max(0,Math.min(start.left+dx,start.left+start.width-Math.min(360,innerWidth)));
        next.width=start.width+start.left-next.left;
      }
      if(edge.includes('n')){
        next.top=Math.max(0,Math.min(start.top+dy,start.top+start.height-Math.min(320,innerHeight)));
        next.height=start.height+start.top-next.top;
      }
      bounds=fit(next);paint();
    };
    node.addEventListener('pointermove',move);
    node.addEventListener('lostpointercapture',()=>node.removeEventListener('pointermove',move),{once:true});

const demoPhotoTiles=Object.fromEntries(factoryRegisters.map(([id])=>[id,[0,1,2,3,4]]));
function demoImage(id,index){
  const tiles=demoPhotoTiles[id];
  const picture=element('img');
  picture.src=demoPhotos[tiles[(index-1)%tiles.length]];
  picture.alt=factoryLabel(['Illustrative repair equipment photo','সার্ভিস সেন্টারের নমুনা ছবি']);
  picture.width=112;
  picture.height=90;
  return picture;
}

function readFactory(){
  const raw = localStorage.getItem(factoryStorage);
  const data = raw ? JSON.parse(raw) : {};
  if(!data || typeof data!=='object' || Array.isArray(data))throw new Error('Invalid register data');
  return data;
}
function factoryRows(data,id){
  const saved=data[id]||[];
  const existing=new Set(saved.map(row=>row.id));
  return [...saved,...demoRecords(id).filter(row=>!existing.has(row.id))];
}
function factoryUpdate(id, record, values){
  try{
    const data = readFactory();
    const rows = factoryRows(data,id);
    if(record){
      const current = rows.find(row=>row.id===record.id);
      if(!current || current.revision!==record.revision)throw new Error('Record changed');
      data[id] = rows.map(row=>row.id===record.id?{...row,...values,revision:crypto.randomUUID()}:row);
    }else{
      data[id] = [{id:crypto.randomUUID(),revision:crypto.randomUUID(),...values,archived:false},...rows];
    }
    const error=validateRepair(data,Boolean(record?.sample));
    if(error){alert(error);return false}
    localStorage.setItem(factoryStorage,JSON.stringify(data));
    return true;
  }catch{alert(factoryText(10));return false}
}
const money=value=>new Intl.NumberFormat(language,{style:'currency',currency:'BDT'}).format(value);
const minor=value=>Math.round(Number(value||0)*100);
const activeRepairRows=(data,id,sample)=>factoryRows(data,id).filter(r=>!r.deleted&&Boolean(r.sample)===sample);
function repairStock(data,code,sample){
 const part=activeRepairRows(data,'parts',sample).find(r=>r.values.code===code);
 return Number(part?.values.opening||0)+activeRepairRows(data,'purchases',sample).filter(r=>r.values.part===code).reduce((sum,r)=>sum+Number(r.values.quantity),0)-activeRepairRows(data,'usage',sample).filter(r=>r.values.part===code).reduce((sum,r)=>sum+Number(r.values.quantity),0);
}
function invoiceTotal(values){return minor(values.labor)+minor(values.partsCharge)-minor(values.discount)}
function validateRepair(data,sample){
 const maps={};
 for(const [id] of factoryRegisters){
  const rows=activeRepairRows(data,id,sample),map=new Map();
  for(const row of rows){
   const key=row.values.code||row.values.reference;
   if(!key||map.has(key))return factoryLabel(['Invalid linked record or duplicate code.','তথ্যের লিংক বা কোড সঠিক নয়।']);
   for(const [field,value] of Object.entries(row.values)){
    if(factoryFields[field]?.[2]==='number'&&(!Number.isFinite(Number(value))||Number(value)<0))return factoryLabel(['Check stock, quantities and payment balances.','মজুত, পরিমাণ ও বাকি যাচাই করুন।']);
   }
   map.set(key,row);
  }
  maps[id]=map;
 }
 const related={customer:'customers',device:'devices',technician:'technicians',part:'parts',supplier:'suppliers',job:'jobs',invoice:'invoices'};
 for(const [id,map] of Object.entries(maps)){
  for(const {values:v} of map.values()){
   for(const [field,target] of Object.entries(related)){
    if(v[field]&&!maps[target].has(v[field]))return factoryLabel(['Invalid linked record or duplicate code.','তথ্যের লিংক বা কোড সঠিক নয়।'])+' '+v[field];
   }
   if(v.device&&v.customer&&maps.devices.get(v.device).values.customer!==v.customer)return 'Customer and device do not match.';
   if(v.quantity&&(!Number.isInteger(Number(v.quantity))||Number(v.quantity)<1))return 'Quantity must be a positive whole number.';
   if(id==='invoices'&&invoiceTotal(v)<0)return 'Discount exceeds invoice total.';
  }
 }
 for(const code of maps.parts.keys())if(repairStock(data,code,sample)<0)return 'Insufficient stock: '+code;
 for(const [reference,row] of maps.invoices){
  const paid=[...maps.payments.values()].filter(r=>r.values.invoice===reference).reduce((sum,r)=>sum+minor(r.values.amount),0);
  if(paid>invoiceTotal(row.values))return factoryLabel(['Check stock, quantities and payment balances.','মজুত, পরিমাণ ও বাকি যাচাই করুন।']);
 }
 return '';
}
function factoryMetrics(id,values,row){
 if(id==='invoices'){
  const data=readFactory(),paid=activeRepairRows(data,'payments',Boolean(row?.sample)).filter(r=>r.values.invoice===values.reference).reduce((sum,r)=>sum+minor(r.values.amount),0);
  return [[11,money(invoiceTotal(values)/100)],[12,money((invoiceTotal(values)-paid)/100)]];
 }
 if(id==='parts')return [[17,String(repairStock(readFactory(),values.code,Boolean(row?.sample)))]];
 if(id==='purchases')return [[11,money(Number(values.quantity)*Number(values.unitPrice))]];
 return [];
}

function photoField(id,editor,save){
  const panel=element('div',undefined,'factory-photo');
  const preview=element('div',undefined,'factory-demo');
  const input=element('input');
  input.type='file';
  input.accept='image/jpeg,image/png,image/webp';
  const label=element('label',factoryLabel(['Record photo','রেকর্ডের ছবি']));
  label.append(input);
  const status=element('p',undefined,'muted');
  status.setAttribute('role','status');
  const remove=button(factoryLabel(['Remove photo','ছবি সরান']),()=>{
    editor.photo=null;
    input.value='';
    status.textContent='';
    refresh();
  });
  function refresh(){
    const photo=recordPhoto(id,{...editor.record,photo:editor.photo});
    preview.replaceChildren(...(photo?[photo]:[]));
    remove.hidden=!photo;
  }
  input.onchange=async()=>{
    const file=input.files[0];
    if(!file)return;
    save.disabled=true;
    input.disabled=true;
    remove.disabled=true;
    status.textContent='';
    let bitmap;
    try{
      if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10000000)throw new Error('Invalid photo');
      bitmap=await createImageBitmap(file);
      const scale=Math.min(1,480/Math.max(bitmap.width,bitmap.height));
      const canvas=element('canvas');
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      const context=canvas.getContext('2d',{alpha:false});
      context.fillStyle='#fff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(bitmap,0,0,canvas.width,canvas.height);
      editor.photo=canvas.toDataURL('image/jpeg',0.78);
      refresh();
    }catch{
      status.textContent=factoryLabel(['Choose a valid JPG, PNG or WebP under 10 MB.','১০ এমবির কম আকারের সঠিক JPG, PNG বা WebP ছবি বাছুন।']);
      input.value='';
    }finally{
      bitmap?.close();
      save.disabled=false;
      input.disabled=false;
      remove.disabled=false;
    }
  };
  refresh();
  panel.append(label,preview,remove,status);
  return panel;
}

const employeeSuggestions={
  paymentMethod:['Cash','Bank transfer','bKash','Nagad','Rocket'],
  status:['Active','Planned','Completed','Present','Absent','Excused','Pending','Paid','Issued','Maintenance']
};
function factoryForm(id, fields, required, container){
  const form=element('form');
  const controls={};
  const editor=factoryEditor;
  const summary=element('p',undefined,'muted');
  summary.setAttribute('aria-live','polite');
  for(const field of fields){
    const schema=factoryFields[field];
    const type=schema[2]||'text';
    const input=element(type==='textarea'?'textarea':'input');
    if(type!=='textarea')input.type=type;
    if(type==='number'){input.min='0';input.max='1000000000000';input.step='any'}
    else input.maxLength=type==='textarea'?2000:180;
    input.required=required.includes(field);
    input.value=factoryEditor.values[field]||'';
    input.oninput=()=>{editor.values[field]=input.value;updateSummary()};
    if(employeeSuggestions[field]){
      const choices=element('datalist');
      choices.id='suggestions-'+field;
      for(const value of employeeSuggestions[field]){
        const option=element('option');
        option.value=value;
        choices.append(option);
      }
      input.setAttribute('list',choices.id);
      form.append(choices);
    }
    const related={customer:'customers',device:'devices',technician:'technicians',part:'parts',supplier:'suppliers',job:'jobs',invoice:'invoices'};
    if(related[field]){
      const list=element('datalist');list.id='related-'+field;input.setAttribute('list',list.id);
      for(const row of factoryRows(readFactory(),related[field])){
        if(row.deleted||row.archived||Boolean(row.sample)!==Boolean(editor.record?.sample))continue;
        const option=element('option');option.value=row.values.code||row.values.reference;option.label=row.values.name||row.values.issue||option.value;list.append(option);
      }
      form.append(list);
    }
    if(field==='status'&&id==='jobs'){
      const list=element('datalist');list.id='repair-status';input.setAttribute('list',list.id);
      for(const value of ['New','Diagnosing','Awaiting approval','Repairing','Ready','Delivered','Cancelled']){const option=element('option');option.value=value;list.append(option)}
      form.append(list);
    }
    controls[field]=input;
    const label=element('label',factoryLabel(schema)+(input.required?' *':''));
    label.dataset.field=field;
    label.append(input);form.append(label);
  }
  const actions=element('div',undefined,'factory-actions');
  const save=element('button',factoryText(8),'primary');
  function updateSummary(){
    summary.textContent=factoryMetrics(id,editor.values).map(([label,value])=>factoryText(label)+' '+value).join(' · ');
  }
  if(id==='invoices'){
    summary.style.gridColumn='1/-1';
    form.append(summary);
    updateSummary();
  }
  form.append(photoField(id,editor,save));
  actions.append(save,button(factoryText(7),()=>{factoryEditor=null;render()}));
  actions.append(button(factoryLabel(['Print form','ফর্ম প্রিন্ট']),()=>{
    if(save.disabled)return;
    printFactoryRows(id,[{...editor.record,values:editor.values,photo:editor.photo,draft:true}]);
  }));
  form.append(actions);
  form.onsubmit=event=>{
    event.preventDefault();
    const values=Object.fromEntries(Object.entries(controls).map(([key,input])=>[key,input.value.trim()]));
    for(const key of required){
      if(!values[key]){controls[key].value='';controls[key].reportValidity();return}
    }
    if(false){
      alert(factoryLabel(['The score must be between zero and the maximum score.','প্রাপ্ত নম্বর শূন্য থেকে পূর্ণ নম্বরের মধ্যে হতে হবে।']));
      return;
    }
    const record=factoryEditor.record;
    if(!save.disabled&&factoryUpdate(id,record,{values,photo:editor.photo})){factoryEditor=null;render()}
  };
  const fieldsPane=element('div',undefined,'factory-form-fields pane-scroll');
  const details=element('div',undefined,'factory-status-notes');
  for(const child of Array.from(form.children)){
    if(child===actions||child.tagName==='DATALIST')continue;
    if(['status','notes'].includes(child.dataset.field)){
      if(!details.parentNode)fieldsPane.append(details);
      details.append(child);
    }else fieldsPane.append(child);
  }
  form.prepend(fieldsPane);
  container.append(form);
}
function factoryCsv(rows, fields){
  const escape=value=>{
    const string=String(value??'');
    const safe=/^[\s\u0000-\u001f]*[=+@-]|^[\t\r\n]/.test(string)?"'"+string:string;
    return '"'+safe.replaceAll('"','""')+'"';
  };
  const entries=[[...fields.map(key=>factoryLabel(factoryFields[key])),factoryLabel(['Sample record','নমুনা রেকর্ড'])],
    ...rows.map(row=>[...fields.map(key=>row.values[key]),row.sample||''])];
  const csv=entries.map(row=>row.map(escape).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));
  const link=element('a');link.href=url;link.download='accessbridge-repair-'+factoryModule+'.csv';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const factoryGroups=[["Repair desk","সার্ভিস ডেস্ক",["customers","devices","jobs","technicians"]],["Parts and purchasing","যন্ত্রাংশ ও ক্রয়",["parts","purchases","usage","suppliers"]],["Accounts and delivery","হিসাব ও ডেলিভারি",["invoices","payments","delivery","expenses"]]];
function openRegister(id){
  const [, , ids]=factoryGroups.find(([, , members])=>members.includes(id));
  expandedFactoryGroups.add(ids[0]);
  if(page!=='factory'||factoryModule!==id){
    factoryModule=id;
    factoryQuery='';
    factoryArchived=false;
    factoryTrash=false;
    factoryEditor={record:null,values:{}};
  }
  navigate('factory');
}
const expandedFactoryGroups=new Set(['customers']);
function factoryLinks(className){
  const sections=factoryGroups.map(([english,bangla,ids])=>{
    const group=element('section',undefined,'factory-group');
    const heading=element('h2');
    group.append(heading);
    const links=element('div',undefined,className);
    for(const id of ids){
      const [,en,bn]=factoryRegisters.find(register=>register[0]===id);
      const link=button(factoryLabel([en,bn]),()=>openRegister(id));
      if(page==='factory'&&factoryModule===id)link.setAttribute('aria-current','page');
      links.append(link);
    }
    if(className==='factory-sidebar-links'){
      const groupId=ids[0];
      links.id='factory-menu-'+groupId;
      const toggle=button(factoryLabel([english,bangla]),()=>{
        if(expandedFactoryGroups.has(groupId))expandedFactoryGroups.delete(groupId);
        else expandedFactoryGroups.add(groupId);
        updateDisclosure();
      },'factory-group-toggle');
      toggle.setAttribute('aria-controls',links.id);
      function updateDisclosure(){
        const expanded=expandedFactoryGroups.has(groupId);
        toggle.setAttribute('aria-expanded',String(expanded));
        links.hidden=!expanded;
      }
      updateDisclosure();
      heading.append(toggle);
    }else{
      heading.textContent=factoryLabel([english,bangla]);
    }
    group.append(links);
    return group;
  });
  return sections;
}


function previewDocuments(rows,title,renderRecord){
  const dialog=element('dialog',undefined,'employee-id-dialog');

  const controls=element('div',undefined,'employee-id-controls');
  const print=button(factoryLabel(['Print','প্রিন্ট']),async()=>{
    print.disabled=true;
    try{
      await Promise.allSettled(Array.from(dialog.querySelectorAll('img'),img=>img.decode()));
      if(dialog.open)window.print();
    }finally{print.disabled=false}
  },'primary');

function printDocuments(title,rows,detailsFor,photoFor=()=>null){
  previewDocuments(rows,title,row=>{
    const sheet=element('article',undefined,'record-print-sheet');
    sheet.append(element('h3','AccessBridge RepairDesk · Bangladesh'),element('h4',title));
    const labels=[];
    if(row.sample)labels.push(factoryLabel(['Sample record','নমুনা রেকর্ড'])+' '+num(row.sample));
    if(row.draft)labels.push(factoryLabel(['Unsaved draft','অসংরক্ষিত খসড়া']));
    if(labels.length)sheet.append(element('p',labels.join(' · ')));
    const photo=photoFor(row);
    if(photo)sheet.append(photo);
    const details=element('dl');
    for(const [label,value] of detailsFor(row)){
      details.append(element('dt',label),element('dd',String(value??'')));
    }
    sheet.append(details);
    return sheet;
  });
}

function renderFactory(){
  const [id,en,bn,fieldList,requiredList]=factoryRegisters.find(register=>register[0]===factoryModule);
  const fields=fieldList.split(' ');
  main.replaceChildren(element('div',factoryText(0),'eyebrow'),element('h1',factoryLabel([en,bn])));
  main.append(element('p',factoryText(15),'muted'));
  const workspace=element('div',undefined,'factory-workspace');
  if(factoryEditor){
    const formTitle=factoryEditor.record?factoryText(3):factoryText(1);
    const editor=element('section',undefined,'factory-editor');
    editor.append(element('h2',formTitle));
    factoryForm(id,fields,requiredList.split(' '),editor);
    workspace.append(editor);
  }
  const records=element('section',undefined,'factory-records');
  const selected=factoryEditor?.record;
  records.append(element('h2',selected?factoryLabel(['Selected record','নির্বাচিত রেকর্ড']):factoryLabel(['Records','রেকর্ড'])));
  workspace.append(records);
  if(factoryEditor){
    const tabs=element('div',undefined,'factory-pane-switch');
    const editorTab=button(factoryLabel(['Form','ফর্ম']),()=>switchPane('form'));
    const recordsTab=button(selected?factoryLabel(['Selected record','নির্বাচিত রেকর্ড']):factoryLabel(['Records','রেকর্ড']),()=>switchPane('records'));
    function switchPane(pane){
      workspace.dataset.pane=pane;
      editorTab.setAttribute('aria-pressed',String(pane==='form'));
      recordsTab.setAttribute('aria-pressed',String(pane==='records'));
    }
    switchPane('form');
    tabs.append(editorTab,recordsTab);
    main.append(tabs);
  }
  main.append(workspace);
  let rows;
  try{rows=factoryRows(readFactory(),id)}catch{main.append(element('p',factoryText(10)));return}
  const toolbar=element('div',undefined,'factory-actions');
  const search=element('input');search.type='search';search.placeholder=factoryText(2);search.setAttribute('aria-label',factoryText(2));search.value=factoryQuery;
  const archive=element('input');archive.type='checkbox';archive.checked=factoryArchived;
  const archiveLabel=element('label',factoryText(6));archiveLabel.prepend(archive);
  const trash=element('input');
  trash.type='checkbox';
  trash.checked=factoryTrash;
  const trashLabel=element('label',factoryLabel(['Trash','ট্র্যাশ']));
  trashLabel.prepend(trash);
  archive.disabled=factoryTrash;
  const table=element('div',undefined,'pane-scroll');
  table.classList.add('factory-card-list');
  if(selected)table.classList.add('factory-card-selected');
  table.tabIndex=0;
  table.setAttribute('aria-label',factoryLabel(['Records','রেকর্ড']));
  const add=button(factoryText(1),()=>{factoryEditor={record:null,values:{}};render()},'primary');
  const exportButton=button(factoryText(16),()=>factoryCsv(filtered(),fields));
  toolbar.append(search,archiveLabel,trashLabel,exportButton);
  if(!factoryEditor)toolbar.prepend(add);

  const printable=rows.filter(row=>!row.deleted&&row.archived===factoryArchived);
  if(!factoryTrash)toolbar.append(printAllRecordsButton(printable,()=>printFactoryRows(id,printable)));
  if(!selected)records.append(toolbar);
  records.append(table);
  const filtered=()=>rows.filter(row=>(factoryTrash?Boolean(row.deleted):!row.deleted&&row.archived===factoryArchived)&&Object.values(row.values).some(value=>String(value).toLocaleLowerCase().includes(factoryQuery.trim().toLocaleLowerCase())));
  function showRows(){
    table.replaceChildren();
    const visible=selected?rows.filter(row=>row.id===selected.id):filtered();
    exportButton.disabled=!visible.length;
    if(!visible.length){table.append(element('p',factoryText(9),'muted'));return}
    for(const row of visible){
      const card=element('article');
      const body=element('div',undefined,'factory-card-content');
      body.tabIndex=0;
      body.setAttribute('aria-label',factoryLabel(['Record details','রেকর্ডের তথ্য']));
      const details=element('dl',undefined,'factory-details');
      for(const key of fields){
        if(!row.values[key])continue;
        details.append(element('dt',factoryLabel(factoryFields[key])),element('dd',row.values[key]));
      }
      for(const [label,value] of factoryMetrics(id,row.values,row))details.append(element('dt',factoryText(label)),element('dd',value));
      const actions=element('div',undefined,'factory-actions');
      if(row.deleted){
        actions.append(button(factoryText(5),()=>{if(factoryUpdate(id,row,{deleted:false}))render()}));
      }else{
        actions.append(
          button(factoryText(3),()=>{factoryEditor={record:row,values:{...row.values},photo:row.photo};render();main.scrollTop=0}),
          button(factoryText(row.archived?5:4),()=>{if(factoryUpdate(id,row,{archived:!row.archived}))render()}),
          button(factoryLabel(['Delete','ডিলিট']),()=>{
            if(confirm(factoryLabel(["Delete","ডিলিট"]))&&factoryUpdate(id,row,{deleted:true})){
              if(factoryEditor?.record?.id===row.id)factoryEditor=null;
              render();
            }
          },'factory-delete')
        );
      }

      const picture=recordPhoto(id,row);
      if(picture||row.sample){
        const preview=element('div',undefined,'factory-demo');
        if(picture)preview.append(picture);
        if(row.sample)preview.append(element('strong',factoryLabel(['Sample record','নমুনা রেকর্ড'])+' '+row.sample));
        body.append(preview);
      }
      body.append(details);
      card.append(body);
      const printRecord=printRecordButton(()=>printFactoryRows(id,[row]));
      if(selected)actions.replaceChildren(printRecord);
      else if(!row.deleted)actions.append(printRecord);
      card.append(actions);
      table.append(card);
    }
  }
  search.oninput=()=>{factoryQuery=search.value;showRows()};
  archive.onchange=()=>{factoryArchived=archive.checked;render()};
  trash.onchange=()=>{factoryTrash=trash.checked;render()};
  showRows();

function render(){
  document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';
  for(const key of ['normal','max','close','open'])byId(key==='open'?'launch':key).textContent=tr(key);
  for(const node of win.querySelectorAll('[data-lang]'))node.setAttribute('aria-pressed',String(node.dataset.lang===language));
  const sidebar=win.querySelector('aside');
  const scroll=sidebar.scrollTop;
  byId('nav').replaceChildren(...['dashboard'].map(key=>{
    const node=button(factoryLabel(['Overview','সারসংক্ষেপ']),()=>navigate(key));
    node.setAttribute('aria-current',key===page?'page':'false');
    node.setAttribute('aria-pressed',String(key===page));
    return node;
  }));
  byId('nav').append(button(factoryLabel(['AI service help','AI সার্ভিস সহায়তা']),()=>navigate('repair-ai')));
  byId('nav').append(button(factoryLabel(['Access and build notes','সহজ ব্যবহার ও তৈরির নথি']),()=>navigate('access-demo')));
  byId('nav').append(button(factoryLabel(['Backup data','ডেটা ব্যাকআপ']),()=>{
    const file=new Blob([JSON.stringify(readFactory(),null,2)],{type:'application/json'});const url=URL.createObjectURL(file);const link=element('a');link.href=url;link.download='RepairDesk-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }));
  for(const [css,en,bn] of [['repair-large','Larger text','বড় লেখা'],['repair-contrast','High contrast','উচ্চ কনট্রাস্ট']]){
    const toggle=button(factoryLabel([en,bn]),()=>{document.body.classList.toggle(css);localStorage.setItem(css,String(document.body.classList.contains(css)));render()});
    toggle.setAttribute('aria-pressed',String(document.body.classList.contains(css)));byId('nav').append(toggle);
  }
  byId('nav').append(...factoryLinks('factory-sidebar-links'));
  sidebar.scrollTop=scroll;
  if(page==='factory'){renderFactory();footer();return}
  if(page==='repair-ai'){renderRepairAI();footer();return}
  if(page==='access-demo'){renderAccessDemo();footer();return}
  const directory=element('div',undefined,'pane-scroll training-overview');
  directory.append(element('p',factoryLabel(['Mobile and computer repair management','মোবাইল ও কম্পিউটার গ্রহণ, মেরামত, যন্ত্রাংশ ও হিসাব পরিচালনা করুন।']),'muted'));
  const stats=element('div',undefined,'cards');
  let data={};
  try{data=readFactory()}catch{}
  for(const id of ['jobs','devices','customers','parts','invoices','delivery']){
    const [,en,bn]=factoryRegisters.find(register=>register[0]===id);
    const rows=factoryRows(data,id).filter(row=>!row.deleted&&!row.archived);
    const card=button(factoryLabel([en,bn]),()=>openRegister(id),'card');
    card.append(element('b',num(rows.filter(row=>!row.sample).length)),
      element('small',factoryLabel(['Live records','নিজস্ব রেকর্ড'])+' · '+num(rows.filter(row=>row.sample).length)+' '+factoryLabel(['Sample records','নমুনা রেকর্ড'])));
    stats.append(card);
  }
  directory.append(stats,...factoryLinks('factory-directory'));
  main.replaceChildren(element('h1',factoryLabel(['Service center','সার্ভিস সেন্টার'])),directory);
  footer();
}
for(const [code,label] of Object.entries(languages)){
  const node=button(label,()=>{language=code;render()});node.lang=code;node.dataset.lang=code;
  win.querySelector('.languages').append(node);
}
for(const css of ['repair-large','repair-contrast'])document.body.classList.toggle(css,localStorage.getItem(css)==='true');
normal();render();
